[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticdb-artifact"
version = "0.1.0"
description = "Artifact package for AgenticDB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "paramiko>=3.4.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
]

[project.scripts]
agenticdb = "main:main"

[tool.setuptools]
py-modules = [
  "auditor",
  "config",
  "expert_candidates",
  "knob_selector",
  "llm_client",
  "loop",
  "main",
  "models",
]

[tool.setuptools.packages.find]
include = [
  "connectors*",
  "memory*",
  "profiles*",
  "skills*",
  "tools*",
  "utils*",
  "validators*",
]

[tool.setuptools.package-data]
skills = ["*.md"]
